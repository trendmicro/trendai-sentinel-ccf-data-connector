name: Validate Templates

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "templates/**"
      - ".github/workflows/validate-templates.yml"

permissions:
  contents: read

jobs:
  json-lint:
    name: JSON syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every JSON file under templates/ (excluding legacy)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if jq empty "$f"; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              fail=1
            fi
          done < <(find templates -name "*.json" -not -path "*/legacy/*" -print0)
          exit "$fail"

  arm-structure:
    name: ARM template structure
    runs-on: ubuntu-latest
    needs: json-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required ARM fields present
        run: |
          set -euo pipefail
          fail=0
          for f in \
            templates/workbench/mainTemplate.json \
            templates/oat/mainTemplate.json; do
            if jq -e '.["$schema"] and .contentVersion and .resources' "$f" >/dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f is missing \$schema / contentVersion / resources"
              fail=1
            fi
          done
          exit "$fail"

      - name: createUiDefinition.json structure
        run: |
          set -euo pipefail
          fail=0
          for f in \
            templates/workbench/createUiDefinition.json \
            templates/oat/createUiDefinition.json; do
            if jq -e '.["$schema"] and .handler and .parameters' "$f" >/dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f is missing \$schema / handler / parameters"
              fail=1
            fi
          done
          exit "$fail"

  bicep-validate:
    name: ARM build (bicep CLI)
    runs-on: ubuntu-latest
    needs: arm-structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bicep
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: bicep build --json (smoke-check ARM templates parse)
        run: |
          set -euo pipefail
          for f in \
            templates/workbench/mainTemplate.json \
            templates/oat/mainTemplate.json; do
            echo "Decompiling $f"
            bicep decompile "$f" --stdout >/dev/null
          done
